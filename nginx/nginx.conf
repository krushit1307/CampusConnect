worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Trust the Docker internal network as the immediate hop in front of us.
    # In production behind AWS ALB / Cloudflare, replace this with your
    # load balancer's actual IP range so the REAL client IP is used for
    # rate limiting instead of the load balancer's own IP.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Shared 10MB rate-limit zone keyed by client IP: 10 requests/second.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 3002;

        location / {
            # Allow short bursts of 20 requests, reject anything beyond
            # that immediately (nodelay) instead of making them wait in
            # a queue — this is what protects Node's CPU during a flood.
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 503;

            proxy_pass http://activitypub:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}