name: E2E Auth Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  auth-e2e:
    name: Playwright Auth E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run authentication E2E tests
        run: npx playwright test e2e/auth.spec.ts --project=chromium --reporter=list
        env:
          # Auth tests run in hermetic "mock" mode: every Supabase API call is
          # intercepted, so these values only need to satisfy the client-side
          # environment validation (never used to reach a real project).
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
          # Non-empty so the Turnstile widget renders; the widget itself is
          # stubbed by the test helpers, so any value works.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          AUTH_E2E_MODE: mock

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-report
          path: playwright-report/
          retention-days: 7
