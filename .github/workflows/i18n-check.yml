name: i18n Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Check translation keys match
        run: |
          # A simple script to ensure the locale files have identical keys
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          function getKeys(obj, prefix = '') {
            return Object.keys(obj).reduce((acc, k) => {
              const pre = prefix.length ? prefix + '.' : '';
              if (typeof obj[k] === 'object' && obj[k] !== null && !Array.isArray(obj[k])) {
                acc.push(...getKeys(obj[k], pre + k));
              } else {
                acc.push(pre + k);
              }
              return acc;
            }, []);
          }
          
          const localesDir = path.join(process.cwd(), 'src/i18n/locales');
          const en = JSON.parse(fs.readFileSync(path.join(localesDir, 'en.json')));
          const enKeys = getKeys(en).sort();
          
          const otherLocales = ['es.json', 'zh.json', 'ar.json'];
          let failed = false;
          
          for (const file of otherLocales) {
            const data = JSON.parse(fs.readFileSync(path.join(localesDir, file)));
            const keys = getKeys(data).sort();
            
            const missing = enKeys.filter(k => !keys.includes(k));
            const extra = keys.filter(k => !enKeys.includes(k));
            
            if (missing.length > 0) {
              console.error(\`\${file} is missing keys: \${missing.join(', ')}\`);
              failed = true;
            }
            if (extra.length > 0) {
              console.error(\`\${file} has extra keys: \${extra.join(', ')}\`);
              failed = true;
            }
          }
          
          if (failed) {
            process.exit(1);
          }
          console.log('All translation keys match!');
          "
