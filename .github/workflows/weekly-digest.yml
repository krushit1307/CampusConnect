name: Weekly Event Digest

on:
  schedule:
    - cron: "0 10 * * 0"

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Invoke weekly-digest Edge Function
        run: |
          # --fail-with-body makes a non-2xx response fail the job (curl exits 0 on HTTP 500 by default).
          # Retries are safe: the per-user daily Idempotency-Key prevents duplicate deliveries.
          curl --fail-with-body \
            --max-time 540 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST \
            "${{ secrets.SUPABASE_FUNCTION_URL }}/weekly-digest" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
