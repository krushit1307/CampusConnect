<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 
      OPTIMIZATION: Resource Hints for Critical External Domains
      Force the browser to establish DNS, TCP, and TLS connections to critical 
      external APIs the millisecond the HTML arrives, cutting out the ~300ms 
      handshake delay during the initial page load.
    -->
  <!-- Supabase API: Preconnect with CORS support -->
  <!-- The crossOrigin attribute is CRITICAL here. If the domain serves API 
         requests that require CORS, we must include it. Otherwise, the browser 
         opens a standard connection, throws it away when it realizes it needs 
         a CORS connection, and opens a brand new one, defeating the purpose. -->
  <link rel="preconnect" href="https://api.supabase.co" crossorigin="anonymous" />
  <!-- Fallback for older browsers that don't support preconnect -->
  <link rel="dns-prefetch" href="https://api.supabase.co" />

  <!-- AWS S3 Image Storage: Preconnect for fast image loading -->
  <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin="anonymous" />
  <link rel="dns-prefetch" href="https://s3.amazonaws.com" />

  <!-- Unsplash (used for mock/placeholder images in the app) -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin="anonymous" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- Google Fonts (If used for typography fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />

  <link rel="preload" href="/fonts/space-grotesk-latin-400-normal.woff2" as="font" type="font/woff2"
    crossorigin="anonymous" />
  <link rel="preload" href="/fonts/space-mono-latin-400-normal.woff2" as="font" type="font/woff2"
    crossorigin="anonymous" />
  <title>CampusConnect</title>
  <script src="/theme-init.js"></script> <!-- Register custom service worker early in head for faster interception -->

  <style>
    /* This is intentionally kept outside the React bundle so it is visible
         while the application's JavaScript is downloading. */
    #app-loading {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: #ffffff;
      color: #111111;
    }

    .app-loading__mark {
      width: min(52vw, 220px);
      height: auto;
    }

    .app-loading__stroke {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 8;
      stroke-dasharray: var(--loader-path-length);
      stroke-dashoffset: var(--loader-path-length);
      animation: draw 2s ease forwards;
    }

    .app-loading__stroke--delayed {
      animation-delay: 120ms;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-color-scheme: dark) {
      #app-loading {
        background: #111111;
        color: #ffffff;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading__stroke {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="app-loading" role="status" aria-label="Loading CampusConnect">
      <svg class="app-loading__mark" viewBox="0 0 240 190" role="img" aria-label="CampusConnect"
        xmlns="http://www.w3.org/2000/svg">
        <title>CampusConnect</title>
        <!-- Each dash length is the exact length of its line or path. -->
        <path class="app-loading__stroke" style="--loader-path-length: 222.279px" d="M24 76L120 20L216 76" />
        <path class="app-loading__stroke app-loading__stroke--delayed" style="--loader-path-length: 160px"
          d="M40 84H200" />
        <path class="app-loading__stroke app-loading__stroke--delayed" style="--loader-path-length: 72px"
          d="M50 88V160" />
        <path class="app-loading__stroke app-loading__stroke--delayed" style="--loader-path-length: 72px"
          d="M85 88V160" />
        <path class="app-loading__stroke app-loading__stroke--delayed" style="--loader-path-length: 72px"
          d="M155 88V160" />
        <path class="app-loading__stroke app-loading__stroke--delayed" style="--loader-path-length: 72px"
          d="M190 88V160" />
        <path class="app-loading__stroke app-loading__stroke--delayed" style="--loader-path-length: 115.124px"
          d="M105 160V126A15 15 0 0 1 135 126V160" />
        <path class="app-loading__stroke app-loading__stroke--delayed" style="--loader-path-length: 180px"
          d="M30 166H210" />
      </svg>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Redundant SW registration at end of body as fallback/standard practice -->
  <script src="/sw-register.js"></script>
</body>

</html>
